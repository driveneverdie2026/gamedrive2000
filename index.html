<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Game Drive Redirect</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 100px 20px;
      background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
      color: #fff;
      margin: 0;
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.1);
      border-top: 4px solid #ff6b35;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Lấy game ID từ URL
    const params = new URLSearchParams(window.location.search);
    const gameId = params.get('id');

    // ===== TỰ ĐỘNG PHÁT HIỆN MÔI TRƯỜNG =====
    let MAIN_DOMAIN;

    // Kiểm tra xem đang test local hay production
    if (window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1') {
      // Đang test local
      MAIN_DOMAIN = 'http://localhost:3000';
    } else {
      // Production - domain thật
      MAIN_DOMAIN = 'http://localhost:3000';

      // KHI ĐỔI DOMAIN PRODUCTION, SỬA Ở ĐÂY:
      // MAIN_DOMAIN = 'https://domain-moi.com';
    }

    if (gameId) {
      // Redirect về domain chính
      const redirectUrl = `${MAIN_DOMAIN}/redirect.html?id=${gameId}`;
      console.log('Redirecting to:', redirectUrl);
      window.location.href = redirectUrl;
    } else {
      // Không có ID
      setTimeout(() => {
        document.body.innerHTML = `
          <div>
            <h1 style="color:#e55;">❌ Link không hợp lệ</h1>
            <p>Vui lòng sử dụng link từ trang game chính thức.</p>
          </div>
        `;
      }, 1000);
    }
  </script>
</head>
<body>
  <div class="spinner"></div>
  <h2>Đang chuyển hướng...</h2>
  <p>Vui lòng đợi trong giây lát...</p>
</body>
</html>
